[workspace]
resolver = "3"
members = [
	"proxy_dll",      # runtime
	"proxy_dll_proc", # rust macros
	"chain_loader",   # dll loader
	"demo_dll",       # demo
]

[workspace.package]
repository = "https://github.com/snowyyd/proxy_dll"
authors = ["trumank", "snowyyd"]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"

[profile.release]
lto = true
codegen-units = 1
# strip = true
